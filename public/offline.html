<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>অফলাইন — No More Silence</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            margin: 20px;
            padding: 32px 24px;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 8px 0;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .emergency-box {
            background-color: rgba(225, 29, 72, 0.1);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .emergency-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fda4af;
            margin-bottom: 8px;
        }
        .emergency-list {
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 13px;
        }
        .emergency-list li {
            margin-bottom: 6px;
        }
        .emergency-list a {
            color: #f43f5e;
            font-weight: 700;
            text-decoration: none;
        }
        .btn {
            display: inline-block;
            background-color: #e11d48;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #be123c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>ইন্টারনেট সংযোগ বিচ্ছিন্ন</h1>
        <p>
            আপনি বর্তমানে অফলাইনে আছেন। সংযোগ পুনরায় স্থাপন হলে পেজটি রিফ্রেশ করুন।
        </p>

        <div class="emergency-box">
            <div class="emergency-title">জরুরি হেল্পলাইন (অফলাইনেও কার্যকর):</div>
            <ul class="emergency-list">
                <li>নারী ও শিশু নির্যাতন হেল্পলাইন: <a href="tel:109">১০৯ (109)</a></li>
                <li>জাতীয় জরুরি সেবা: <a href="tel:999">৯৯৯ (999)</a></li>
                <li>শিশু হেল্পলাইন: <a href="tel:1098">১০৯৮ (1098)</a></li>
            </ul>
        </div>

        <button class="btn" onclick="window.location.reload()">পুনরায় চেষ্টা করুন (Retry)</button>
    </div>
</body>
</html>
