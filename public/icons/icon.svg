<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#be123c" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Center Badge Circle -->
  <circle cx="256" cy="256" r="160" fill="#be123c" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#f43f5e" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Exclamation Mark Symbol -->
  <g fill="url(#accentGrad)">
    <!-- Top Bar -->
    <path d="M 232,150 C 232,136.7 242.7,126 256,126 C 269.3,126 280,136.7 280,150 L 274,270 C 274,279.9 265.9,288 256,288 C 246.1,288 238,279.9 238,270 Z"/>
    <!-- Bottom Dot -->
    <circle cx="256" cy="346" r="24"/>
  </g>
</svg>
